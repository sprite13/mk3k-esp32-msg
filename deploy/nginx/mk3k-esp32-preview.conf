# Merge these locations into the existing les13.tech TLS server block.
# This fragment is not a complete nginx site and must not replace other routes.
location = /mk3k-esp32-preview {
    auth_basic off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;
    return 301 /mk3k-esp32-preview/;
}

location ^~ /mk3k-esp32-preview/ {
    alias /var/www/mk3k-esp32-preview/current/;
    index index.html;
    autoindex off;
    auth_basic off;
    default_type application/octet-stream;
    types {
        text/html html;
        text/css css;
        text/javascript js mjs;
        image/svg+xml svg;
        application/wasm wasm;
    }
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;
}
